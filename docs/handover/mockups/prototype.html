<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchtopus Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: a working desktop tool, calm and dense, like a shipped developer app
IDEA: a control room console for Claude Code sessions, clickable with scripted scenarios
PICTURE: the app itself fills the screen; the simulation panel is visibly separate (dashed violet)
COLOUR and TYPE: dark palette; one colour per kind of decision: amber permission, violet spec/plan gate, green PR, red danger/stalled, orange overlap, blue running
LAYOUT: top bar, project tree, work area with resizable panes, advisor chat beside every review-type view
*/
:root{color-scheme:dark;--bg:#0D0E11;--chrome:#121419;--panel:#16181E;--raise:#1D2028;--line:#23262E;--line2:#2A2E38;--ink:#E8EAF0;--ink2:#C4C9D4;--mute:#A0A7B4;--dim:#8D95A3;--amber:#F5A524;--blue:#6AA7FF;--green:#3DD68C;--red:#FF6B6B;--violet:#B49CFF;--orange:#FF9F43;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:0 12px;height:52px;background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:700;font-size:15px;margin-right:6px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--amber);display:inline-block}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:8px;background:var(--raise);border:1px solid var(--line2);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:#252935}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--raise)}
.btn.on{background:#232733;border-color:#3A3F4B;color:var(--ink);font-weight:600}
.btn.ok{background:#12301F;border-color:#24603F;color:#9AF0C2}
.btn.no{background:#341416;border-color:#6A2A2E;color:#FFB3B3}
.btn.warn{background:#2B2210;border-color:#5A4418;color:#F5C26B}
.btn.vio{background:#2A2140;border-color:#4A3A75;color:#CDBBFF}
.btn.org{background:#2E1D0C;border-color:#6A4318;color:#FFC48A}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.hold{position:relative;overflow:hidden}
.btn.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#FF6B6B44;transition:width 1s linear}
.btn.hold.holding i{width:100%}
.kbd{font:500 10.5px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--amber);color:#1A1200;font:700 11.5px/20px Inter;text-align:center;padding:0 5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-run{background:var(--blue)}.d-need{background:var(--amber)}.d-gate{background:var(--violet)}.d-hang{background:var(--red)}.d-review,.d-pr{background:var(--green)}.d-idle,.d-done{background:#5A606C}
.kind{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--mono);letter-spacing:.02em;border-radius:5px;padding:4px 6px;white-space:nowrap}
.k-approval{background:#2B2210;color:#F5C26B}.k-danger{background:#341416;color:#FFB3B3}.k-plan,.k-spec{background:#2A2140;color:#CDBBFF}.k-prdraft{background:#12261C;color:#7BE2AE}.k-hang{background:#341416;color:#FFB3B3}.k-overlap{background:#2E1D0C;color:#FFC48A}.k-handoff{background:#16233A;color:#B9D4FF}
.body{flex:1 1 auto;display:flex;min-height:0}
.side{flex:0 0 240px;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;padding:12px 8px}
.h2{font-size:11.5px;color:var(--mute);font-weight:600;padding:4px 8px}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:7px 8px;font-size:13px;color:var(--ink2);min-height:34px}
.node:hover{background:var(--raise)}
.node.sel{background:#232733;color:var(--ink);font-weight:600}
.node small{margin-left:auto}
.main{flex:1 1 0;display:flex;flex-direction:column;min-width:0;min-height:0}
.mhead{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{font:500 11px/1 var(--mono);border-radius:999px;padding:5px 8px;white-space:nowrap;display:inline-block}
.need{margin:10px 16px 0;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;border:1px solid}
.need.approval{background:#1F1809;border-color:#5A4418}.need.danger{background:#250F11;border-color:#7A2F35}.need.plan,.need.spec{background:#1B1630;border-color:#4A3A75}.need.prdraft{background:#0F2419;border-color:#24603F}.need.hang{background:#250F11;border-color:#6A2A2E}.need.overlap{background:#23170A;border-color:#6A4318}.need.handoff{background:#111B2B;border-color:#2E4A78}
.need .what{color:var(--ink2);font-size:13px;line-height:1.5}
.others{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 16px 0;font-size:12px;color:var(--mute)}
.others button{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;min-height:30px;color:var(--ink2)}
.term{flex:1 1 auto;min-height:0;overflow:auto;margin:10px 16px 0;padding:12px 14px;background:#0B0C0F;border:1px solid var(--line);border-radius:8px;font:12.5px/1.65 var(--mono);white-space:pre-wrap;color:#D5D9E2}
.l-tool{color:var(--ink)}.l-sub{color:var(--dim)}.l-ok{color:#7BE2AE}.l-bad{color:#FF9A9A}.l-warn{color:#F5C26B}.l-user{color:#CDBBFF}.l-vio{color:var(--violet)}.l-hand{color:#B9D4FF}
.bandrow{display:flex;align-items:flex-end;gap:10px;margin:8px 16px 0;padding-bottom:6px;border-bottom:1px solid var(--line);min-height:50px;font:12.5px var(--mono);color:var(--ink2)}
.bubble{font:500 12.5px/1.3 Inter;color:#0D0E11;background:#F2EDE4;border-radius:8px;padding:5px 9px;white-space:nowrap;margin-bottom:12px}
.prompt{display:flex;align-items:center;gap:10px;margin:8px 16px 12px;border:1px solid #3A3F4B;border-radius:7px;padding:8px 12px}
.prompt input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font:13px var(--mono);min-height:26px}
.right{background:var(--chrome);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;flex:none}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex:none}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-size:13px;color:var(--mute);min-height:38px}
.tab.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
.rbody{flex:1 1 auto;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:14px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{font:500 11.5px var(--mono);padding:4px 7px;border-radius:6px;background:var(--raise);color:var(--dim)}
.step.done{color:#7BE2AE}.step.cur{background:#16233A;color:#B9D4FF}
.bar{height:6px;border-radius:3px;background:#2A2E38;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.row{display:flex;align-items:center;gap:8px;font-size:13px}
.row .r{margin-left:auto}
.g-ok{color:#7BE2AE}.g-fail{color:#FF9A9A}.g-run{color:#B9D4FF}.g-wait{color:var(--dim)}.g-warn{color:#F5C26B}
.chat{border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0;flex:none}
.msgs{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.55}
.msg{max-width:68ch}.msg.me{align-self:flex-end;background:#232733;border-radius:10px;padding:7px 11px}
.msg.sys{color:var(--mute);font-size:12.5px}
.chatin{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex:none}
.chatin input{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--ink);font:14px Inter;padding:7px 10px;min-height:38px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.quick button{background:var(--raise);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink2);min-height:30px}
.adv{flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.hand{background:#111B2B;border:1px solid #2E4A78;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hand textarea{background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--ink);font:13px/1.45 Inter;padding:6px 8px;resize:vertical;min-height:52px;width:100%}
.hstep{display:flex;flex-direction:column;gap:5px;border-top:1px solid #22324D;padding-top:8px}
.shell{display:flex;flex-direction:column;border-top:1px solid var(--line);background:#0B0C0F;flex:none;min-height:0}
.shell .out{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 14px;font:12.5px/1.6 var(--mono);white-space:pre-wrap;color:#D5D9E2}
.shell form{display:flex;gap:6px;padding:0 14px 8px;font:12.5px var(--mono);color:#7BE2AE;align-items:center}
.shell input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font:12.5px var(--mono);min-height:26px}
.shtab{display:flex;align-items:center;gap:7px;font-size:12.5px;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;padding:5px 10px;color:var(--ink2);min-height:32px}
.shtab.on{background:#16181E;border-color:var(--line2);color:var(--ink);font-weight:600}
.vsplit{flex:0 0 6px;cursor:col-resize;position:relative;margin:0 -3px;z-index:3;touch-action:none}
.vsplit:hover,.hsplit:hover{background:#6AA7FF55}
.hsplit{flex:0 0 6px;cursor:row-resize;margin:-3px 0;z-index:3;position:relative;touch-action:none}
.foot{display:flex;gap:18px;align-items:center;padding:6px 14px;background:var(--chrome);border-top:1px solid var(--line);font:11.5px var(--mono);color:var(--mute);flex:none;flex-wrap:wrap}
.drawer{position:fixed;top:52px;right:0;bottom:28px;width:min(480px,100%);background:var(--chrome);border-left:1px solid var(--line2);box-shadow:-20px 0 40px #0008;display:flex;flex-direction:column;z-index:20}
.cmd{font:12.5px var(--mono);background:#0B0C0F;border:1px solid var(--line2);border-radius:6px;padding:7px 9px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scrim{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute)}
.field input,.field select,.field textarea,.inp{background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--ink);font:14px Inter;padding:8px 10px;min-height:38px}
textarea.inp{font:13px/1.55 var(--mono);resize:vertical}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:62px;display:flex;flex-direction:column;gap:8px;z-index:40;width:min(420px,calc(100% - 32px))}
.toast{background:#1D2028;border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;font-size:13px;box-shadow:0 10px 30px #0008}
.sim{position:fixed;left:16px;bottom:40px;width:300px;max-height:calc(100% - 110px);overflow:auto;background:#15121F;border:1.5px dashed #6B58A8;border-radius:12px;padding:12px;z-index:25;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px #000a}
.sim h3{margin:0;font-size:13px;color:#CDBBFF;display:flex;align-items:center;gap:8px}
.sim .sbtn{display:flex;align-items:center;gap:8px;text-align:left;width:100%;background:#1F1A2E;border:1px solid #3A3156;border-radius:7px;padding:7px 9px;font-size:12.5px;min-height:34px}
.sim .sbtn:hover{background:#2A2340}
.sim .sbtn span{color:#9C8FC4;font:11px var(--mono);margin-left:auto}
.tour{background:#221B36;border:1px solid #4A3A75;border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:1.5}
.pad{position:fixed;right:460px;bottom:40px;z-index:24;background:linear-gradient(#1F222A,#16181E);border:1px solid var(--line2);border-radius:18px;padding:14px;box-shadow:0 18px 40px #000a;display:flex;flex-direction:column;gap:10px;width:330px}
.lcd{background:#05060A;border:2px solid #000;border-radius:6px;padding:8px;font-size:12px;min-height:120px;display:flex;flex-direction:column;gap:2px}
.lcd .sr{display:flex;gap:7px;align-items:center;padding:3px 6px;border-radius:4px}
.lcd .sr.sel{background:#1B1F2A}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:46px;border-radius:9px;background:linear-gradient(#2B2F38,#1E2128);border:1px solid #3A3F4B;box-shadow:0 3px 0 #0A0B0D;font:600 12px Inter}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #0A0B0D}
.big{width:74px;height:74px;border-radius:50%;border:4px solid #0A0B0D;box-shadow:0 5px 0 #0A0B0D,0 0 0 6px #22252D;font:700 11.5px Inter;color:#0D0E11}
.big[disabled]{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.watch{position:fixed;right:24px;bottom:40px;z-index:24;display:flex;flex-direction:column;align-items:center;gap:8px}
.wface{width:300px;height:300px;border-radius:50%;background:#000;border:12px solid #22252D;box-shadow:0 0 0 3px #2A2E38,0 18px 40px #000a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;overflow:hidden;position:relative;gap:6px}
.wpill{border:0;border-radius:20px;min-height:40px;padding:0 14px;font:600 13px Inter}
.wrow{display:flex;align-items:center;gap:8px;background:#1B1D24;border-radius:18px;padding:7px 12px;width:200px;font-size:12.5px;border:0;color:var(--ink);text-align:left}
.board{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:16px;overflow:auto}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.col h3{margin:0;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.bcard{text-align:left;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;width:100%}
.bcard:hover{border-color:#4A505C}
.page{flex:1;min-height:0;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.page h1{margin:0;font-size:21px}
.vhead{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.diff{font:12.5px/1.6 var(--mono);background:#0B0C0F;border:1px solid var(--line2);border-radius:8px;overflow:auto;white-space:pre}
.diff .a{background:#0F2A1C;color:#9AF0C2;display:block}.diff .d{background:#2E1416;color:#FFB3B3;display:block}.diff .c{color:var(--dim);display:block}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sw{display:flex;align-items:center;gap:10px;min-height:36px;font-size:13.5px}
.sw input{width:18px;height:18px;accent-color:var(--amber)}
.restore{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.doc{flex:1 1 auto;min-height:0;overflow:auto;background:#0B0C0F;border:1px solid var(--line2);border-radius:8px;padding:18px 26px;font-size:14.5px;line-height:1.6}
.doc .blk{border-radius:6px;padding:2px 8px;margin:0 -8px;cursor:text;border:1px solid transparent}
.doc .blk:hover{border-color:#2A2E38;background:#121419}
.doc h1{font-size:21px;margin:8px 0}.doc h2{font-size:17px;margin:14px 0 4px}.doc h3{font-size:15px;margin:14px 0 2px;color:#CDBBFF}
.doc p{margin:6px 0}.doc ul{margin:4px 0;padding-left:22px}.doc li{margin:2px 0}
.doc code{font:12.5px var(--mono);background:#1D2028;border-radius:4px;padding:1px 5px}
.doc li.task{list-style:none;margin-left:-20px;display:flex;gap:8px;align-items:flex-start}
.doc li.task input{margin-top:5px;width:15px;height:15px;accent-color:var(--violet)}
.doc textarea.blkedit{width:100%;background:#121419;border:1px solid #4A3A75;border-radius:6px;color:var(--ink);font:13px/1.6 var(--mono);padding:8px 10px;resize:vertical;min-height:80px}
.editor{flex:1 1 auto;min-height:0;width:100%;resize:none;background:#0B0C0F;border:1px solid var(--line2);border-radius:8px;color:#E3E6EE;font:13px/1.65 var(--mono);padding:14px 16px;outline:none}
.tag{font:600 10.5px var(--mono);border-radius:4px;padding:2px 6px;background:#2A2140;color:#CDBBFF}
.find{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45}
.find input{margin-top:3px;width:16px;height:16px;accent-color:var(--amber);flex:none}
.petw{display:inline-block;line-height:0}
.anim .pet-arbeitet{animation:bob .6s steps(2) infinite}.anim .pet-tanzt{animation:dance .8s steps(4) infinite}.anim .pet-winkt{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes dance{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (max-width:1100px){.kbd{display:none}.top{overflow-x:auto}.top .btn{flex:none}.side{display:none}.pad{right:16px;bottom:330px}}
@media (max-width:800px){.right,.adv,.vsplit{display:none}.board{grid-template-columns:minmax(0,1fr)}.sim{width:calc(100% - 32px)}.split{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

  if (h) { e.preventDefault(); const k = h.dataset.split; drag = {k, x: e.clientX, y: e.clientY, start: S.sizes[k]}; document.body.style.cursor = getComputedStyle(h).cursor; return; }
  const hd = e.target.closest('[data-hold]');
  if (hd) { const [fn, arg] = hd.dataset.hold.split(':'); hd.classList.add('holding'); holdTimer = setTimeout(() => { holdTimer = null; if (fn === 'allow') { const s = ses(arg); if (s && s.need) { doAllow(s, 'Orchtopus (held)'); toast('Allowed once: ' + s.name, 'green'); } } else A[fn](arg); render(); }, 1000); }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const d = drag; const lim = (v, a, b) => Math.max(a, Math.min(b, v));
  if (d.k === 'right' || d.k === 'adv') S.sizes[d.k] = lim(d.start - (e.clientX - d.x), 300, window.innerWidth * 0.6);
  if (d.k === 'chatH') S.sizes.chatH = lim(d.start - (e.clientY - d.y), 140, window.innerHeight - 260);
  if (d.k === 'shell') S.sizes.shell = lim(d.start - (e.clientY - d.y), 120, window.innerHeight - 300);
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
});
document.addEventListener('pointerup', () => {
  if (drag) { drag = null; document.body.style.cursor = ''; }
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; document.querySelectorAll('.holding').forEach(x => x.classList.remove('holding')); toast('Hold for 1 second to confirm'); }
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (e.ctrlKey && (e.key === 'ö' || e.key === 'Ö' || e.key === '`')) { e.preventDefault(); A.shell(); render(); return; }
  if (e.key === 'Escape') { if (S.editBlk >= 0) S.editBlk = -1; else if (S.modal) S.modal = null; else if (S.inbox) S.inbox = false; else if (['doc', 'diff', 'reviewDetail', 'prDetail'].includes(S.view)) back(); render(); return; }
  if (typing || !S.opened || e.ctrlKey || e.metaKey || e.altKey) return;
  const map = {'1': () => A.view('session'), '2': () => A.view('board'), '3': () => A.view('review'), '4': () => A.view('prs'), '5': () => A.view('settings'), 'i': A.inbox, 'I': A.inbox, 'n': A.newSession, 'N': A.newSession};
  if (map[e.key]) { e.preventDefault(); map[e.key](); render(); }
});
startTimer();
render();
}
</script>
