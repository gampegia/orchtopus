<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review page explorations, 2026-11-28</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-ui); font-size: var(--type-body); line-height: var(--leading-body); }
  header { position: sticky; top: 0; z-index: 2; background: var(--surface-page); border-bottom: var(--border-width) solid var(--border-subtle); padding: var(--space-4) var(--space-8); display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-8); align-items: center; }
  h1 { font-size: var(--type-title); font-weight: var(--weight-medium); margin: 0; }
  .group { display: flex; align-items: center; gap: var(--space-2); }
  .group span { color: var(--text-muted); font-size: var(--type-small); }
  button { font: inherit; font-size: var(--type-small); color: var(--text-primary); background: var(--surface-raised); border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-control); padding: var(--space-1) var(--space-3); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--surface-panel); border-color: var(--border-strong); font-weight: var(--weight-medium); }
  button:focus-visible, a:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
  main { padding: var(--space-6) var(--space-8) var(--space-12); display: grid; gap: var(--space-8); }
  article h2 { font-size: var(--type-title); font-weight: var(--weight-medium); margin: 0 0 var(--space-1); }
  article p { margin: 0 0 var(--space-3); color: var(--text-secondary); max-width: 72ch; }
  .frame { position: relative; aspect-ratio: 1440 / 900; max-width: 1440px; border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-bar); overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  a { color: var(--accent-default); }
</style>
</head>
<body>
<header>
  <h1>Review page for specs and plans</h1>
  <div class="group" id="screens"><span>Screen</span></div>
  <div class="group" id="modes"><span>Mode</span></div>
  <div class="group" id="labels"><span>Labels</span></div>
</header>
<main id="grid"></main>
<script>
  const directions = [
    ['d-mix', 'D · Map with parts (chosen)', 'B as the base, with the parts from C as a strip that shows where something is flagged, the decision in its own tinted bar, and every step of the plan readable on demand.'],
    ['a-brief', 'A · Brief', 'One reading column like a memo. The decision card sits in a rail on the right and never scrolls away. Waves run top to bottom.'],
    ['b-map', 'B · Map', 'First screen: a three-part summary band and a lane map of the whole plan. Plan Go sits in the view header. Details below the map.'],
    ['c-parts', 'C · Parts', 'The document cut into parts of one or two minutes, read one at a time. Decisions are answered in place. The decision bar sits at the bottom.']
  ];
  const state = { screen: '1', mode: 'dark', labels: 'signal' };
  const opts = { screens: [['1', 'Plan waits'], ['2', 'Plan runs'], ['3', 'Spec waits']], modes: [['dark', 'Dark'], ['light', 'Light']], labels: [['signal', 'Signal labels'], ['asked', 'Red and green']] };
  const key = { screens: 'screen', modes: 'mode', labels: 'labels' };
  for (const g of Object.keys(opts)) for (const [v, t] of opts[g]) {
    const b = document.createElement('button'); b.textContent = t; b.dataset.g = g; b.dataset.v = v;
    b.onclick = () => { state[key[g]] = v; draw(); }; document.getElementById(g).append(b);
  }
  function draw() {
    document.documentElement.dataset.mode = state.mode;
    document.querySelectorAll('header button').forEach((b) => b.setAttribute('aria-pressed', String(state[key[b.dataset.g]] === b.dataset.v)));
    document.getElementById('grid').innerHTML = directions.map(([f, n, d]) => {
      const h = `screen=${state.screen}&mode=${state.mode}&labels=${state.labels}`;
      return `<article><h2>${n}</h2><p>${d} <a href="${f}.html#${h}">Open full size</a></p><div class="frame"><iframe src="${f}.html#${h}" title="${n}" loading="lazy"></iframe></div></article>`;
    }).join('');
  }
  draw();
</script>
</body>
</html>
